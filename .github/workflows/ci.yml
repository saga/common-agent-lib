name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    name: check (Node.js ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify agent-dreaming as an installed package
        shell: bash
        run: |
          set -euo pipefail
          pack_file="$(npm pack --workspace=@saga/agent-dreaming --pack-destination "$RUNNER_TEMP" --silent | tail -n 1)"
          consumer="$RUNNER_TEMP/agent-dreaming-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init --yes >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP/$pack_file"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { SqliteDreamingStore } from '@saga/agent-dreaming';
          import { SqliteDreamingStore as SqliteSubpath } from '@saga/agent-dreaming/sqlite';

          assert.equal(SqliteDreamingStore, SqliteSubpath);
          const store = new SqliteDreamingStore({ filename: ':memory:' });
          await store.putEvidence('package-smoke', {
            ref: 'evidence:1',
            kind: 'test',
            content: 'standalone package works'
          });
          const evidence = await store.resolve({ scope: 'package-smoke', refs: ['evidence:1'] });
          assert.equal(evidence[0]?.content, 'standalone package works');
          await store.close();
          NODE
