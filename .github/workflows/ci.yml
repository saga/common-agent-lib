name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    name: check (Node.js ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  pdf-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: PDF Engine (Python 3.11)
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/pdf-engine/pyproject.toml
      - name: Install PDF Engine
        run: python -m pip install -e ".[dev]"
        working-directory: packages/pdf-engine
      - name: Run tests
        run: python -m pytest
        working-directory: packages/pdf-engine
      - name: Lint
        run: python -m ruff check .
        working-directory: packages/pdf-engine
