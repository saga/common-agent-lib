name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    name: packages (Node.js ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  agent-dreaming:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    name: standalone Agent Dreaming (Node.js ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install this package only
        working-directory: whole/agent-dreaming
        run: npm install --workspaces=false --no-audit --no-fund
      - name: Typecheck, test, benchmark and build
        working-directory: whole/agent-dreaming
        run: |
          npm run typecheck
          npm test
          npm run benchmark
          npm run build
      - name: Verify packed package in an isolated consumer
        working-directory: whole/agent-dreaming
        shell: bash
        run: |
          set -euo pipefail
          pack_file="$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -n 1)"
          consumer="$RUNNER_TEMP/agent-dreaming-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init --yes >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP/$pack_file"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { SqliteDreamingStore } from '@saga/agent-dreaming';
          import { SqliteDreamingStore as SqliteSubpath } from '@saga/agent-dreaming/sqlite';

          assert.equal(SqliteDreamingStore, SqliteSubpath);
          const store = new SqliteDreamingStore({ filename: ':memory:' });
          await store.putEvidence('package-smoke', {
            ref: 'evidence:1',
            kind: 'test',
            content: 'standalone package works'
          });
          const evidence = await store.resolve({ scope: 'package-smoke', refs: ['evidence:1'] });
          assert.equal(evidence[0]?.content, 'standalone package works');
          await store.close();
          NODE

  rust-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: standalone Rust Agent
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - name: Run Clippy
        working-directory: whole/rust-agent
        run: cargo clippy --all-targets
      - name: Run tests
        working-directory: whole/rust-agent
        run: cargo test --all-targets
      - name: Build standalone binaries
        working-directory: whole/rust-agent
        run: cargo build --release --bins
