name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    name: check (Node.js ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - name: Commit generated npm lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.node-version == 26
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const content = fs.readFileSync('package-lock.json');
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'package-lock.json',
              message: 'build: add npm workspace lockfile',
              content: content.toString('base64'),
              branch: 'main',
            });
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
