name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    name: check (Node.js ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - name: Export generated lockfile (temporary)
        if: matrix.node-version == 26
        uses: actions/upload-artifact@v7.0.2
        with:
          name: generated-npm-lockfile
          path: package-lock.json
          archive: false
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
