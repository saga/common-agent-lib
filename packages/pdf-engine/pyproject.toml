[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "saga-pdf-engine"
version = "0.1.0"
description = "Local PDF inspection, extraction, page editing, rendering and reflow preparation for AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5.0,<7",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9", "mypy>=1.13"]

[project.scripts]
saga-pdf-engine = "pdf_engine.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
